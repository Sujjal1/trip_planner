services:
  app:
    build:
      context: ..
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/codrive.sqlite3
      COOKIE_SECURE: "true"
      DEMO_MODE: "false"
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EIA_API_KEY: ${EIA_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
    volumes:
      - garage-data:/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  garage-data:
  certificates:
  caddy-config:
