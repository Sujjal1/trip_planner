name: CoDrive checks
on: [push, pull_request]
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: codrive_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: codrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql://codrive_test:test-only-password@localhost:5432/codrive_test
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest backend/tests -q
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Validate deployment configuration
        run: APP_DOMAIN=codrive.example.com docker compose -f deploy/compose.yaml --env-file deploy/.env.example config --quiet
      - name: Build deployment container
        run: docker build -t codrive:test .
      - name: Verify container startup
        run: |
          docker run -d --name codrive-test -p 127.0.0.1:8000:8000 codrive:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              curl --fail --silent http://127.0.0.1:8000/ | grep -q 'CoDrive'
              exit 0
            fi
            sleep 2
          done
          docker logs codrive-test
          exit 1
      - name: Clean up deployment test
        if: always()
        run: docker rm -f codrive-test || true
